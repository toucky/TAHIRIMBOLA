name: One-time Gestion Fonds 3D APK build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gestion Fonds build branch
        uses: actions/checkout@v4
        with:
          ref: gestion-fonds-icon-build
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare output
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Gestion-Fonds-APP-MADA-v1.0.1-ICON-3D.apk
          sha256sum Gestion-Fonds-APP-MADA-v1.0.1-ICON-3D.apk > Gestion-Fonds-APP-MADA-v1.0.1-ICON-3D.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Fonds-APP-MADA-v1.0.1-ICON-3D
          path: Gestion-Fonds-APP-MADA-v1.0.1-ICON-3D.apk
          retention-days: 7
