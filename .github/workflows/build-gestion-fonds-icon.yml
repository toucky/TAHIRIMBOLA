name: Build Gestion Fonds APK 3D Icon

on:
  push:
    branches:
      - gestion-fonds-icon-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Gestion-Fonds-APP-MADA-v1.0.1-ICON-3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Fonds-APP-MADA-v1.0.1-ICON-3D
          path: Gestion-Fonds-APP-MADA-v1.0.1-ICON-3D.apk
          retention-days: 7
