name: Build Gestion Fonds APK

on:
  push:
    branches:
      - gestion-fonds-client-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestion-fonds-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: gestion-fonds-client-build

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore embedded HTML
        run: base64 -d app/src/main/assets/index.html.gz.b64 | gzip -d > app/src/main/assets/index.html

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Gestion-Fonds-APP-MADA-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Fonds-APP-MADA-v1.0.0
          path: gestion-fonds-android/Gestion-Fonds-APP-MADA-v1.0.0.apk
          retention-days: 7
