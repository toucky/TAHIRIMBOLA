plugins {
    id 'com.android.application'
}

android {
    namespace 'mg.appmada.gestionfonds'
    compileSdk 35

    defaultConfig {
        applicationId 'mg.appmada.gestionfonds'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
