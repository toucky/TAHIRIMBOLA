name: One-time Gestion Fonds 3D APK build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gestion Fonds build branch
        uses: actions/checkout@v4
        with:
          ref: gestion-fonds-icon-build
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare output
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Gestion-Fonds-APP-MADA-v1.0.1-ICON-3D.apk
          base64 /tmp/Gestion-Fonds-APP-MADA-v1.0.1-ICON-3D.apk > /tmp/Gestion-Fonds-APP-MADA-v1.0.1-ICON-3D.apk.b64
          sha256sum /tmp/Gestion-Fonds-APP-MADA-v1.0.1-ICON-3D.apk > /tmp/Gestion-Fonds-APP-MADA-v1.0.1-ICON-3D.apk.sha256

      - name: Commit encoded APK to build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p build-output
          cp /tmp/Gestion-Fonds-APP-MADA-v1.0.1-ICON-3D.apk.b64 build-output/
          cp /tmp/Gestion-Fonds-APP-MADA-v1.0.1-ICON-3D.apk.sha256 build-output/
          git add build-output
          git commit -m "Build Gestion Fonds v1.0.1 3D icon APK" || exit 0
          git push origin HEAD:gestion-fonds-icon-build
